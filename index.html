<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobalt Learning Paths</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:#FAFAF8;color:#1a1a1a;font-size:14px;min-height:100vh}
a{color:inherit;text-decoration:none}

/* Nav */
.nav{background:#fff;border-bottom:1px solid #e5e5e5;padding:0 20px;height:48px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-left{display:flex;align-items:center;gap:14px}
.nav-logo{font-weight:700;font-size:17px}
.nav-logo span{color:#2563EB}
.nav-crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:#888}
.nav-crumbs .link{cursor:pointer;text-decoration:underline}
.nav-crumbs .current{color:#333;font-weight:500}
.nav-crumbs .sep{opacity:0.4}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-ai{font-size:12px;color:#666;background:#f5f5f5;border:1px solid #e5e5e5;padding:4px 12px;border-radius:16px;cursor:pointer}
.nav-avatar{width:28px;height:28px;border-radius:14px;background:linear-gradient(135deg,#2563EB,#7C3AED);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}

/* Home */
.home-hero{max-width:820px;margin:0 auto;padding:48px 20px 32px;text-align:center}
.home-hero h1{font-size:36px;font-weight:700;letter-spacing:-0.8px;line-height:1.25;margin-bottom:12px}
.home-hero h1 em{font-style:italic;color:#2563EB}
.home-hero .sub{font-size:16px;color:#777;max-width:540px;margin:0 auto 8px;line-height:1.6}
.home-hero .meta{font-size:13px;color:#aaa}
.home-prompt{max-width:600px;margin:0 auto 14px;text-align:center}
.home-prompt h2{font-size:18px;font-weight:600;margin-bottom:2px}
.home-prompt p{font-size:13px;color:#888}
.track-grid{max-width:1020px;margin:0 auto;padding:0 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.track-card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:20px 18px;cursor:pointer;position:relative;transition:box-shadow 0.15s}
.track-card:hover{box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.track-badge{position:absolute;top:10px;right:10px;font-size:9px;font-weight:600;padding:2px 8px;border-radius:10px;text-transform:uppercase}
.track-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-bottom:10px}
.track-card .title{font-size:16px;font-weight:600;margin-bottom:5px}
.track-card .desc{font-size:14px;color:#777;line-height:1.5;margin-bottom:12px}
.track-card .stats{display:flex;gap:8px;font-size:12px;color:#aaa}
.track-card .cta{margin-top:12px;font-size:14px;font-weight:500}

/* Track View */
.track-view{max-width:1000px;margin:0 auto;padding:28px 20px 60px}
.back-link{font-size:14px;color:#888;cursor:pointer;margin-bottom:18px}
.back-link:hover{color:#555}
.tv-eyebrow{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.tv-eyebrow .dot{width:7px;height:7px;border-radius:4px;display:inline-block}
.track-view h1{font-size:28px;font-weight:700;margin-bottom:10px}
.track-view .intro{font-size:15px;color:#777;line-height:1.6;max-width:620px;margin-bottom:18px}
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.progress-bar{flex:1;height:5px;background:#eee;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width 0.3s}
.progress-label{font-size:12px;color:#999}
.topic-list{display:flex;flex-direction:column;gap:8px}
.topic-row{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;align-items:flex-start;gap:12px;transition:box-shadow 0.15s}
.topic-row:hover{box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.topic-num{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.topic-row .body{flex:1}
.topic-row .body .title{font-size:15px;font-weight:600;margin-bottom:3px}
.topic-row .body .desc{font-size:13px;color:#888}
.topic-row .right{text-align:right;flex-shrink:0}
.topic-row .right .time{font-size:11px;color:#bbb}
.topic-row .right .arrow{font-size:15px;margin-top:4px}

/* Topic Detail — widened single column */
.topic-detail{max-width:1000px;margin:0 auto;padding:32px 24px 80px}
.td-header{margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid #eee}
.td-eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:10px}
.td-eyebrow .pill{padding:3px 10px;border-radius:10px;font-size:11px}
.td-eyebrow .pos{font-weight:400}
.topic-detail h1{font-size:28px;font-weight:700;margin-bottom:8px;letter-spacing:-0.3px}
.topic-detail .goal{font-size:16px;color:#777;line-height:1.6}
.td-meta{display:flex;gap:14px;margin-top:12px;font-size:13px;color:#999}
.td-section-title{font-size:18px;font-weight:600;margin-bottom:12px}
.step-list{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.step-card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start}
.step-num{width:28px;height:28px;border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.step-card .step-title{font-size:16px;font-weight:600;margin-bottom:4px}
.step-card .step-desc{font-size:15px;color:#777;line-height:1.6}
.step-screenshot{margin-top:14px;border:1px solid #e5e5e5;border-radius:8px;overflow:hidden}
.step-screenshot img{width:100%;display:block}
.tip-box{border-radius:10px;padding:18px 20px;font-size:15px;line-height:1.6;margin:20px 0;border-left:3px solid}
.resources-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.resource-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border:1px solid #e5e5e5;border-radius:8px;font-size:13px;cursor:pointer}
.resource-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.resource-item .rname{font-weight:500}
.resource-item .rtype{font-size:11px;color:#aaa}
.td-footer{display:flex;justify-content:space-between;align-items:center;margin-top:36px;padding-top:16px;border-top:1px solid #eee}
.btn{padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:none}
.btn-outline{border:1px solid #e5e5e5;background:#fff;color:#333}
.btn-primary{color:#fff}
.btn-complete{font-size:13px;padding:6px 14px;border-radius:14px;cursor:pointer}

/* Outcome box */
.outcome-box{background:#f8f7ff;border:1px solid #e9e5ff;border-radius:10px;padding:20px 22px;margin-bottom:28px}
.outcome-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:8px}
.outcome-text{font-size:15px;color:#555;line-height:1.65}

/* Screenshot */
.screenshot-placeholder{background:#f5f5f4;border:1px dashed #d6d3d1;border-radius:8px;padding:32px 16px;text-align:center;margin-top:14px}
.screenshot-placeholder .ss-icon{font-size:22px;color:#a8a29e;margin-bottom:4px}
.screenshot-placeholder .ss-label{font-size:12px;color:#a8a29e;font-weight:500}

/* Enhanced resource item */
.resource-item-v2{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;background:#fff;border:1px solid #e5e5e5;border-radius:8px;cursor:pointer;transition:box-shadow 0.15s;text-decoration:none;color:inherit}
.resource-item-v2:hover{box-shadow:0 2px 8px rgba(0,0,0,0.06);border-color:#d5d5d0}
.resource-item-v2 .rname{font-weight:600;font-size:15px;margin-bottom:2px}
.resource-item-v2 .rdesc{font-size:13px;color:#999;line-height:1.4}
.resource-item-v2 .arrow-icon{margin-left:auto;color:#ccc;font-size:16px;flex-shrink:0;align-self:center}
.resource-coming{opacity:0.55;cursor:default}
.resource-coming:hover{box-shadow:none;border-color:#e5e5e5}
.resource-coming .coming-tag{font-size:10px;color:#aaa;font-weight:500;margin-top:3px}

/* Chat */
.chat-btn{position:fixed;bottom:16px;right:16px;width:46px;height:46px;border-radius:23px;background:linear-gradient(135deg,#2563EB,#7C3AED);color:#fff;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(37,99,235,0.3);font-size:18px;z-index:200}
.chat-panel{position:fixed;bottom:72px;right:16px;width:320px;height:420px;background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,0.12);border:1px solid #e5e5e5;z-index:200;display:flex;flex-direction:column;overflow:hidden}
.chat-header{padding:10px 14px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between}
.chat-avatar{width:26px;height:26px;border-radius:13px;background:linear-gradient(135deg,#2563EB,#7C3AED);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
.chat-header .info .name{font-weight:600;font-size:12px}
.chat-header .info .status{font-size:10px;color:#059669}
.chat-close{background:none;border:none;font-size:16px;cursor:pointer;color:#aaa}
.chat-messages{flex:1;padding:10px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.chat-msg{max-width:82%;padding:7px 11px;font-size:12px;line-height:1.5}
.chat-msg.bot{align-self:flex-start;background:#f3f4f6;color:#333;border-radius:10px 10px 10px 3px}
.chat-msg.user{align-self:flex-end;background:#2563EB;color:#fff;border-radius:10px 10px 3px 10px}
.chat-suggestions{display:flex;flex-wrap:wrap;gap:4px;padding:0 14px 8px}
.chat-sugg-btn{font-size:10px;padding:3px 9px;border-radius:12px;border:1px solid #e5e5e5;background:#fff;cursor:pointer;color:#777}
.chat-input-row{padding:8px 10px;border-top:1px solid #eee;display:flex;gap:6px}
.chat-input{flex:1;border:1px solid #e5e5e5;border-radius:14px;padding:6px 12px;font-size:12px;font-family:inherit;outline:none}
.chat-send{width:28px;height:28px;border-radius:14px;border:none;background:#2563EB;color:#fff;cursor:pointer;font-size:13px}

.hidden{display:none !important}

@media(max-width:600px){
  .track-grid{grid-template-columns:1fr}
  .resources-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- NAV -->
<div class="nav">
  <div class="nav-left">
    <div class="nav-logo">cobalt<span>.</span></div>
    <div class="nav-crumbs" id="crumbs">
      <span id="crumb-home">Learning Paths</span>
    </div>
  </div>
  <div class="nav-right">
    <button class="nav-ai" onclick="toggleChat()">Ask AI</button>
    <div class="nav-avatar">CJ</div>
  </div>
</div>

<!-- PAGES -->
<div id="page-home"></div>
<div id="page-track" class="hidden"></div>
<div id="page-topic" class="hidden"></div>

<!-- CHAT -->
<button class="chat-btn" id="chatBtn" onclick="toggleChat()">?</button>
<div class="chat-panel hidden" id="chatPanel">
  <div class="chat-header">
    <div style="display:flex;align-items:center;gap:8px">
      <div class="chat-avatar">AI</div>
      <div class="info"><div class="name">Cobalt AI Assistant</div><div class="status">Online</div></div>
    </div>
    <button class="chat-close" onclick="toggleChat()">&times;</button>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-suggestions" id="chatSuggestions"></div>
  <div class="chat-input-row">
    <input class="chat-input" id="chatInput" placeholder="Ask a question..." onkeydown="if(event.key==='Enter')sendChat()">
    <button class="chat-send" onclick="sendChat()">&uarr;</button>
  </div>
</div>

    topics: [
      { title: "Size your total category on Amazon", desc: "Understand overall category revenue and drill into subcategory-level detail.", time: "15 min", goal: "By the end of this topic, you will know how to pull total category revenue, break it down by subcategory, and identify which segments are driving growth.", steps: [["Navigate to Market Overview", "Open Cobalt and click Market in the left nav. Select your primary category from the dropdown. You will see the total monthly revenue estimate at the top of the page."], ["Drill into subcategories", "Scroll to the Subcategory Breakdown table. Sort by revenue to see which product types drive the most volume. Click any row to see brand-level detail."], ["Set your date range", "Use the date picker in the top-right to compare periods. Try Last 3 months vs prior 3 months to spot category growth or decline trends."], ["Export your findings", "Click Export then CSV to pull the data into a spreadsheet. Useful for sharing category sizing with your team."]], tip: "Start broad and narrow down. Sizing the full category first gives you a baseline to measure your own market share against.", resources: [["Market Overview Guide", "Article"], ["Category Sizing Walkthrough", "Video"], ["Try it in Cobalt", "Tour"]] },
      { title: "Understand your market share", desc: "Benchmark your brand share vs the category and spot where you are falling behind.", time: "15 min", goal: "You will learn how to calculate and track your brand market share at the category and subcategory level.", steps: [["Open Market Share view", "From the Market module, click the Share tab. Your brand share is calculated automatically based on revenue data."], ["Compare against top brands", "The brand leaderboard shows the top 10 brands by share. Find your position."], ["Break down by subcategory", "Switch to Subcategory view to see where you over or under index."], ["Track share over time", "Toggle to the trend view to see month-over-month changes."]], tip: "Market share in a growing category is different from share in a declining one. Always check category growth alongside your share trend.", resources: [["Market Share Explained", "Article"], ["Share Analysis Checklist", "Checklist"]] },
      { title: "Identify white space and category gaps", desc: "Find areas where demand exists but competition is low.", time: "15 min", goal: "You will use Cobalt market data to identify product niches with high demand and low competition.", steps: [["Open the Opportunity Finder", "Navigate to Market then Opportunities. This view cross-references search demand with competitive density."], ["Filter for high demand low competition", "Set the demand filter to High and competition to Low."], ["Evaluate opportunity size", "Click into any opportunity to see estimated monthly revenue, average price point, and review count."], ["Save to a watchlist", "Click the star icon to save promising opportunities and monitor them over time."]], tip: "White space does not guarantee success. Validate with search volume trends and check for barriers to entry.", resources: [["Finding White Space Guide", "Article"], ["Opportunity Finder Demo", "Video"]] },
      { title: "Validate a new product opportunity", desc: "Use demand data to de-risk launch decisions before investing.", time: "15 min", goal: "You will learn to build a data-backed business case for a new product idea.", steps: [["Start with keyword demand", "Go to Search then Keywords and search for terms related to your product idea."], ["Assess competitive intensity", "Click See Products to review the current top results."], ["Estimate revenue potential", "Use the Revenue Calculator to estimate monthly revenue potential."], ["Build your validation brief", "Export findings to create a one-page summary: market size, demand trend, landscape, estimated revenue."]], tip: "This workflow is especially useful when presenting new product ideas to leadership. Data from Cobalt adds credibility.", resources: [["Product Validation Framework", "Article"], ["Launch Readiness Checklist", "Checklist"]] },
      { title: "Support roadmap and M&A decisions", desc: "Inform strategic decisions beyond day-to-day Amazon operations.", time: "15 min", goal: "You will learn how to pull category-level intelligence for strategic planning and acquisition due diligence.", steps: [["Build a category landscape view", "In Market Overview, select multiple related categories. Export the combined data set."], ["Identify acquisition targets", "Use the brand leaderboard to find brands with growing share in attractive subcategories."], ["Run due diligence data pulls", "Pull estimated revenue, product count, review trajectory, and market share trend for a target brand."], ["Create a strategic summary", "Combine findings into a dashboard view covered in the Report With Confidence path."]], tip: "Cobalt data is directional. Use it to inform decisions, then validate with your internal data before committing.", resources: [["Strategic Use Cases Guide", "Article"]] }

      { title: "Identify category disruption", desc: "Spot new entrants and emerging brands or products capturing share in your category.", time: "15 min", goal: "You will learn to identify new competitors, track emerging threats, and understand where share is shifting in your segments.", outcome: "After completing this topic, you will be able to use your saved segments to detect new brands entering your space, products gaining traction, and shifts in competitive dynamics before they become obvious.", steps: [["Check the Brands tab for new entrants", "Open your saved segment and go to the Brands tab. Sort by growth rate to surface brands that are gaining share quickly."], ["Review the Products tab for rising ASINs", "Switch to the Products tab and sort by revenue growth. New ASINs with fast velocity often signal a competitive shift."], ["Compare across date ranges", "Toggle between 30D, 90D, and 1Y views. A brand that is small in the 1Y view but large in the 30D view is gaining momentum."], ["Build a watch list", "Save a narrower segment focused on emerging competitors so you can track them separately over time."]], tip: "Not every new entrant is a threat. Focus on brands that are gaining share in your specific subcategories, not just the broad category.", resources: [["Video Walkthrough", "Video", "See disruption detection in action"], ["Quick Reference Guide", "Guide", "One-page visual summary you can save or print"], ["In-Depth Written Guide", "Guide", "Detailed walkthrough with full screenshots, edge cases, and context"], ["Try it in Cobalt", "Tour", "Interactive product tour"]] }

  search: {

    topics: [

    topics: [
      { title: "Set up 3P seller monitoring", desc: "Know who is selling your products and get alerted when new sellers appear.", time: "12 min", goal: "You will configure Cobalt to track all third-party sellers on your listings.", steps: [["Navigate to Brand Protection", "Click Protect in the left nav."], ["Add your ASINs", "Click Add Products and paste your ASINs or search by product name."], ["Review current sellers", "See all active sellers per ASIN: name, price, fulfillment, Buy Box status."], ["Enable new seller alerts", "Get email notifications within 24 hours of a new 3P seller appearing."]], tip: "Start with your top 20 ASINs by revenue. These are where unauthorized sellers hurt most.", resources: [["3P Monitoring Guide", "Article"], ["Try it in Cobalt", "Tour"]] },
      { title: "Identify unauthorized resellers", desc: "Distinguish authorized partners from unauthorized sellers.", time: "15 min", goal: "You will flag unauthorized sellers and build your enforcement list.", steps: [["Review your seller list", "Go to Sellers to see all 3P sellers across tracked ASINs."], ["Mark authorized sellers", "Click the checkmark next to known authorized sellers to filter them out."], ["Investigate unknowns", "Click any seller to see their profile, products, and pricing history."], ["Build enforcement list", "Flag and export unauthorized sellers for your legal team."]], tip: "Some unauthorized sellers are retail arbitrage. Understanding the source helps determine the right response.", resources: [["Unauthorized Seller Guide", "Article"]] },
      { title: "Monitor and defend your Buy Box", desc: "Track Buy Box ownership and take action when you lose it.", time: "15 min", goal: "You will understand Buy Box dynamics and monitor your ownership rate.", steps: [["Open Buy Box Monitor", "Click the Buy Box tab in Protect."], ["Identify at-risk listings", "Sort by Buy Box Rate ascending. Below 80% needs attention."], ["See who is taking your Buy Box", "Click any listing to see which sellers are winning and at what price."], ["Set up loss alerts", "Configure alerts for when your rate drops below 75%."]], tip: "Buy Box loss is often a pricing issue. Check if an unauthorized seller is undercutting you.", resources: [["Buy Box Strategy Guide", "Article"]] },
      { title: "Track pricing violations", desc: "Detect when sellers violate your MAP policies.", time: "15 min", goal: "You will configure MAP monitoring and learn how to handle violations.", steps: [["Set your MAP prices", "Go to Pricing Rules and enter MAP for each tracked ASIN."], ["Enable violation alerts", "Cobalt flags any seller pricing below your MAP."], ["Review violation history", "See all MAP violations with seller, product, and duration details."], ["Export for enforcement", "Export the violation log for your legal team."]], tip: "Consistent enforcement matters. No consequences means more violations.", resources: [["MAP Monitoring Guide", "Article"]] },
      { title: "Build a brand protection dashboard", desc: "Create a single view of brand health metrics.", time: "15 min", goal: "You will build a weekly brand protection snapshot dashboard.", steps: [["Create a new dashboard", "Go to Dashboards then New. Name it Brand Protection."], ["Add Buy Box widget", "Show your aggregate win rate and trend."], ["Add seller count widget", "Track unique seller count. Rising counts may indicate a leak."], ["Add violations summary", "Show MAP violation count and trend."]], tip: "Share this dashboard broadly. More visibility means faster response to issues.", resources: [["Protection Dashboard Guide", "Article"]] }

};

const CHAT_ANSWERS = {
  "How do I track a competitor?": "Head to Competitors in the left nav, click Add Competitor, and search by brand name. Cobalt auto-detects their catalog. The Know Your Competition path, Topic 1, walks through the full setup.",
  "What is share of voice?": "SOV measures how visible your brand is in Amazon search results vs competitors. It is the percentage of top positions your products occupy. See Win the Search, Topic 2 for details.",
  "Help me build a dashboard": "Go to Dashboards, click New, and add widgets from any module. Start with 4-5 widgets max. The Report With Confidence path, Topic 1 has the full guide."
};

// ============ STATE ============
let currentPage = "home";
let currentTrackId = null;
let currentTopicIdx = null;
let completed = {};
let chatOpen = false;
let chatMessages = [{ from: "bot", text: "Hi! I can help you get the most out of Cobalt. Ask me anything about features, data, or these learning paths." }];
let showSuggestions = true;

// ============ NAVIGATION ============
function goHome() { currentPage = "home"; currentTrackId = null; currentTopicIdx = null; render(); }
function goTrack(id) { currentPage = "track"; currentTrackId = id; currentTopicIdx = null; render(); }
function goTopic(id, idx) { currentPage = "topic"; currentTrackId = id; currentTopicIdx = idx; render(); window.scrollTo(0, 0); }
function toggleDone(id, idx) { var k = id + "-" + idx; completed[k] = !completed[k]; render(); }

// ============ CHAT ============
function toggleChat() {
  chatOpen = !chatOpen;
  document.getElementById("chatPanel").classList.toggle("hidden", !chatOpen);
  document.getElementById("chatBtn").textContent = chatOpen ? "\u00D7" : "?";
}
function sendChat(text) {
  var input = document.getElementById("chatInput");
  var msg = text || input.value.trim();
  if (!msg) return;
  chatMessages.push({ from: "user", text: msg });
  input.value = "";
  showSuggestions = false;
  renderChat();
  setTimeout(function() {
    var answer = CHAT_ANSWERS[msg] || "Great question! In the full version I would search the knowledge base to give you a specific answer. For now, check the learning paths for common workflows.";
    chatMessages.push({ from: "bot", text: answer });
    renderChat();
  }, 500);
}
function renderChat() {
  var container = document.getElementById("chatMessages");
  container.innerHTML = chatMessages.map(function(m) {
    return '<div class="chat-msg ' + (m.from === "bot" ? "bot" : "user") + '">' + escHtml(m.text) + '</div>';
  }).join("");
  container.scrollTop = container.scrollHeight;
  var suggDiv = document.getElementById("chatSuggestions");
  if (showSuggestions) {
    suggDiv.innerHTML = Object.keys(CHAT_ANSWERS).map(function(q) {
      return '<button class="chat-sugg-btn" onclick="sendChat(\'' + escAttr(q) + '\')">' + escHtml(q) + '</button>';
    }).join("");
  } else {
    suggDiv.innerHTML = "";
  }
}

// ============ HELPERS ============
function escHtml(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function escAttr(s) { return s.replace(/'/g, "\\'").replace(/"/g, "&quot;"); }
function countDone(trackId) {
  var c = 0;
  for (var k in completed) { if (k.indexOf(trackId) === 0 && completed[k]) c++; }
  return c;
}

// ============ RENDER ============
function render() {
  document.getElementById("page-home").classList.toggle("hidden", currentPage !== "home");
  document.getElementById("page-track").classList.toggle("hidden", currentPage !== "track");
  document.getElementById("page-topic").classList.toggle("hidden", currentPage !== "topic");

  renderCrumbs();
  if (currentPage === "home") renderHome();
  if (currentPage === "track") renderTrack();
  if (currentPage === "topic") renderTopicDetail();
  renderChat();
}

function renderCrumbs() {
  var el = document.getElementById("crumbs");
  var trk = currentTrackId ? TRACKS[currentTrackId] : null;
  var top = trk && currentTopicIdx !== null ? trk.topics[currentTopicIdx] : null;
  var html = '';
  if (currentPage === "home") {
    html = '<span>Learning Paths</span>';
  } else if (currentPage === "track") {
    html = '<span class="link" onclick="goHome()">Learning Paths</span><span class="sep">/</span><span class="current">' + escHtml(trk.label) + '</span>';
  } else if (currentPage === "topic") {
    var shortTitle = top.title.length > 30 ? top.title.slice(0, 30) + "..." : top.title;
    html = '<span class="link" onclick="goHome()">Learning Paths</span><span class="sep">/</span><span class="link" onclick="goTrack(\'' + currentTrackId + '\')">' + escHtml(trk.label) + '</span><span class="sep">/</span><span class="current">' + escHtml(shortTitle) + '</span>';
  }
  el.innerHTML = html;
}

function renderHome() {
  var el = document.getElementById("page-home");
  var html = '<div class="home-hero"><h1>Learn Cobalt by doing <em>your</em> work</h1><p class="sub">Choose the path that matches what you are trying to accomplish. Each one walks you through Cobalt step-by-step with real tasks.</p><p class="meta">5 paths / 25 guided topics / ~15 min each</p></div>';
  html += '<div class="home-prompt"><h2>What are you trying to do?</h2><p>Pick the use case that matters most right now.</p></div>';
  html += '<div class="track-grid">';
  for (var id in TRACKS) {
    var t = TRACKS[id];
    html += '<div class="track-card" onclick="goTrack(\'' + id + '\')" style="border-top:3px solid ' + t.color + '">';
    if (t.badge) html += '<span class="track-badge" style="background:' + t.bg + ';color:' + t.color + '">' + t.badge + '</span>';
    html += '<div class="track-icon" style="background:' + t.bg + ';color:' + t.color + '">' + t.letter + '</div>';
    html += '<div class="title">' + escHtml(t.label) + '</div>';
    html += '<div class="desc">' + escHtml(t.desc) + '</div>';
    html += '<div class="stats"><span>' + t.topics.length + ' topics</span><span>/</span><span>~' + (t.topics.length * 15) + ' min</span></div>';
    html += '<div class="cta" style="color:' + t.color + '">Start path &rarr;</div>';
    html += '</div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

function renderTrack() {
  var el = document.getElementById("page-track");
  var trk = TRACKS[currentTrackId];
  var dc = countDone(currentTrackId);
  var pct = Math.round(dc / trk.topics.length * 100);

  var html = '<div class="track-view">';
  html += '<div class="back-link" onclick="goHome()">&larr; All Learning Paths</div>';
  html += '<div class="tv-eyebrow" style="color:' + trk.color + '"><span class="dot" style="background:' + trk.color + '"></span>' + escHtml(trk.label) + '</div>';
  html += '<h1>' + escHtml(trk.label) + '</h1>';
  html += '<p class="intro">' + escHtml(trk.intro) + '</p>';
  html += '<div class="progress-row"><div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%;background:' + trk.color + '"></div></div><span class="progress-label">' + dc + ' of ' + trk.topics.length + ' done</span></div>';
  html += '<div class="topic-list">';
  trk.topics.forEach(function(t, i) {
    var isDone = completed[currentTrackId + "-" + i];
    html += '<div class="topic-row" onclick="goTopic(\'' + currentTrackId + '\',' + i + ')">';
    html += '<div class="topic-num" style="background:' + (isDone ? "#ecfdf5" : trk.bg) + ';color:' + (isDone ? "#059669" : trk.color) + '">' + (isDone ? "&#10003;" : (i + 1)) + '</div>';
    html += '<div class="body"><div class="title">' + escHtml(t.title) + '</div><div class="desc">' + escHtml(t.desc) + '</div></div>';
    html += '<div class="right"><div class="time">' + t.time + '</div><div class="arrow" style="color:' + trk.color + '">&rarr;</div></div>';
    html += '</div>';
  });
  html += '</div></div>';
  el.innerHTML = html;
}

function renderTopicDetail() {
  var el = document.getElementById("page-topic");
  var trk = TRACKS[currentTrackId];
  var top = trk.topics[currentTopicIdx];
  var isDone = completed[currentTrackId + "-" + currentTopicIdx];

  var html = '<div class="topic-detail">';
  html += '<div class="back-link" onclick="goTrack(\'' + currentTrackId + '\')">&larr; Back to ' + escHtml(trk.label) + '</div>';

  // Header
  html += '<div class="td-header">';
  html += '<div class="td-eyebrow" style="color:' + trk.color + '"><span class="pill" style="background:' + trk.bg + '">' + escHtml(trk.label) + '</span><span class="pos">Topic ' + (currentTopicIdx + 1) + ' of ' + trk.topics.length + '</span></div>';
  html += '<h1>' + escHtml(top.title) + '</h1>';
  html += '<p class="goal">' + escHtml(top.goal) + '</p>';
  html += '<div class="td-meta"><span>' + top.time + '</span><span>Step-by-step guide</span></div>';
  html += '</div>';

  // Outcome box
  if (top.outcome) {
    html += '<div class="outcome-box">';
    html += '<div class="outcome-label" style="color:' + trk.color + '">What you\'ll be able to do</div>';
    html += '<div class="outcome-text">' + escHtml(top.outcome) + '</div>';
    html += '</div>';
  }

  // Steps
  html += '<h2 class="td-section-title">Step-by-step guide</h2>';
  html += '<div class="step-list">';
  top.steps.forEach(function(st, i) {
    html += '<div class="step-card">';
    html += '<div class="step-num" style="background:' + trk.color + '">' + (i + 1) + '</div>';
    html += '<div style="flex:1">';
    html += '<div class="step-title">' + escHtml(st[0]) + '</div>';
    html += '<div class="step-desc">' + escHtml(st[1]) + '</div>';
    if (st[2] && st[2] !== "screenshot") {
      html += '<div class="step-screenshot"><img src="' + encodeURI(st[2]) + '" alt="' + escHtml(st[0]) + '" onerror="this.parentElement.outerHTML=\'<div class=screenshot-placeholder><div class=ss-icon>&#128247;</div><div class=ss-label>Image not found: ' + escHtml(st[2]).replace(/'/g, '') + '</div></div>\'"></div>';
    } else if (st[2] === "screenshot") {
      html += '<div class="screenshot-placeholder"><div class="ss-icon">&#128247;</div><div class="ss-label">Screenshot: ' + escHtml(st[0]) + '</div></div>';
    }
    html += '</div></div>';
  });
  html += '</div>';

  // Tip
  html += '<div class="tip-box" style="background:' + trk.bg + ';border-left-color:' + trk.color + '"><strong>Pro tip: </strong>' + escHtml(top.tip) + '</div>';

  // Resources
  if (top.resources && top.resources.length) {
    html += '<h2 class="td-section-title">Learn your way</h2>';
    html += '<p style="font-size:14px;color:#888;margin-bottom:14px">Same workflow, different formats. Pick whichever works best for you.</p>';
    html += '<div class="resources-grid">';
    top.resources.forEach(function(r) {
      var iconMap = { "Guide": "G", "Video": "V", "Tour": "T", "Article": "A", "Checklist": "C", "Template": "T" };
      var icon = iconMap[r[1]] || r[1].charAt(0);
      var url = r[3] || null;
      var hasLink = url && url !== null;
      if (hasLink) {
        html += '<a href="' + url + '" target="_blank" class="resource-item-v2">';
      } else {
        html += '<div class="resource-item-v2 resource-coming">';
      }
      html += '<div class="resource-icon" style="background:' + trk.bg + ';color:' + trk.color + '">' + icon + '</div>';
      html += '<div><div class="rname">' + escHtml(r[0]) + '</div>';
      if (hasLink) {
        html += '<div class="rdesc">' + escHtml(r[2] || r[1]) + '</div>';
      } else {
        html += '<div class="rdesc">' + escHtml(r[2] || r[1]) + '</div>';
        html += '<div class="coming-tag">Coming soon</div>';
      }
      html += '</div>';
      if (hasLink) {
        html += '<span class="arrow-icon">&nearr;</span></a>';
      } else {
        html += '</div>';
      }
    });
    html += '</div>';
  }

  // Footer nav
  html += '<div class="td-footer">';
  if (currentTopicIdx > 0) {
    html += '<button class="btn btn-outline" onclick="goTopic(\'' + currentTrackId + '\',' + (currentTopicIdx - 1) + ')">&larr; Previous</button>';
  } else {
    html += '<div></div>';
  }
  html += '<button class="btn-complete" onclick="event.stopPropagation();toggleDone(\'' + currentTrackId + '\',' + currentTopicIdx + ')" style="background:' + (isDone ? "#ecfdf5" : "transparent") + ';border:' + (isDone ? "1px solid #059669" : "1px dashed #ccc") + ';color:' + (isDone ? "#059669" : "#999") + '">' + (isDone ? "&#10003; Completed" : "Mark complete") + '</button>';
  if (currentTopicIdx < trk.topics.length - 1) {
    html += '<button class="btn btn-primary" style="background:' + trk.color + '" onclick="goTopic(\'' + currentTrackId + '\',' + (currentTopicIdx + 1) + ')">Next topic &rarr;</button>';
  } else {
    html += '<button class="btn btn-primary" style="background:' + trk.color + '" onclick="goHome()">Finish path &#10003;</button>';
  }
  html += '</div>';
  html += '</div>';

  el.innerHTML = html;
}

// ============ INIT ============
render();
</script>
</body>
</html>
