const CHAT_ANSWERS = {
  "How do I track a competitor?": "Head to Competitors in the left nav, click Add Competitor, and search by brand name. Then create a custom segment to group them with your products. The Know Your Competition path, Topic 1, walks through the full setup.",
  "What is share of voice?": "SOV measures how visible your brand is in Amazon search results vs competitors. It is the percentage of top positions your products occupy. See Win the Search, Topic 2 for details.",
  "Help me build a dashboard": "Go to Dashboards, click New, and add widgets from any module. Start with 4-6 widgets max. The Report With Confidence path, Topic 2 has the full guide.",
  "How do I analyze my pricing?": "The Optimize and Grow path, Topic 3 walks you through running a pricing analysis — comparing your prices to competitors, tracking trends, and finding optimization opportunities."
};

const SUGGESTIONS = Object.keys(CHAT_ANSWERS);

function LearningPaths() {
  const [page, setPage] = useState("home");
  const [tid, setTid] = useState(null);
  const [topIdx, setTopIdx] = useState(null);
  const [done, setDone] = useState({});
  const [chatOpen, setChatOpen] = useState(false);
  const [msgs, setMsgs] = useState([{ f: "b", t: "Hi! I can help you get the most out of Cobalt. Ask me anything about features, data, or these learning paths." }]);
  const [inp, setInp] = useState("");
  const [sugg, setSugg] = useState(true);

  const goHome = () => { setPage("home"); setTid(null); setTopIdx(null); };
  const goTrack = (id) => { setPage("track"); setTid(id); setTopIdx(null); };
  const goTopic = (id, i) => { setPage("topic"); setTid(id); setTopIdx(i); };
  const markDone = (id, i) => { const k = id+"-"+i; setDone(p => ({...p, [k]: !p[k]})); };

  const sendMsg = (text) => {
    if (!text.trim()) return;
    const newM = [...msgs, { f: "u", t: text }];
    setMsgs(newM);
    setInp("");
    setSugg(false);
    setTimeout(() => {
      const a = CHAT_ANSWERS[text] || "Great question! In the full version I would search the knowledge base to give you a specific answer. For now, check the learning paths for common workflows.";
      setMsgs(p => [...p, { f: "b", t: a }]);
    }, 500);
  };

  const trk = tid ? TRACKS[tid] : null;
  const top = trk && topIdx !== null ? trk.topics[topIdx] : null;
  const dc = trk ? Object.keys(done).filter(k => k.startsWith(tid) && done[k]).length : 0;

  return (
    <div style={{ fontFamily: "-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif", background: "#FAFAF8", minHeight: "100vh", color: "#1a1a1a", fontSize: 14 }}>

      {/* NAV BAR */}
      <div style={{ background: "#fff", borderBottom: "1px solid #e5e5e5", padding: "0 20px", height: 48, display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 100 }}>

          <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, color: "#888" }}>
            <span onClick={goHome} style={{ cursor: "pointer", textDecoration: page !== "home" ? "underline" : "none" }}>Learning Paths</span>
            {tid && (
              <>
                <span style={{ opacity: 0.4 }}>/</span>
                {topIdx !== null ? (
                  <>
                    <span onClick={() => goTrack(tid)} style={{ cursor: "pointer", textDecoration: "underline" }}>{trk.label}</span>
                    <span style={{ opacity: 0.4 }}>/</span>
                    <span style={{ color: "#333", fontWeight: 500 }}>{top.title.length > 30 ? top.title.slice(0, 30) + "..." : top.title}</span>
                  </>
                ) : (
                  <span style={{ color: "#333", fontWeight: 500 }}>{trk.label}</span>
                )}
              </>
            )}
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <button onClick={() => setChatOpen(o => !o)} style={{ fontSize: 12, color: "#666", background: "#f5f5f5", border: "1px solid #e5e5e5", padding: "4px 12px", borderRadius: 16, cursor: "pointer" }}>Ask AI</button>

        </div>
      </div>

        <div>

            <p style={{ fontSize: 15, color: "#777", maxWidth: 500, margin: "0 auto 6px", lineHeight: 1.6 }}>Choose the path that matches what you are trying to accomplish. Each one walks you through Cobalt step-by-step with real tasks.</p>
            <p style={{ fontSize: 12, color: "#aaa" }}>6 modules / 25 guided topics / ~15 min each</p>
          </div>
          <div style={{ maxWidth: 600, margin: "0 auto 14px", textAlign: "center" }}>
            <h2 style={{ fontSize: 18, fontWeight: 600, marginBottom: 2 }}>What are you trying to do?</h2>
            <p style={{ fontSize: 13, color: "#888" }}>Pick the use case that matters most right now.</p>
          </div>
          <div style={{ maxWidth: 1020, margin: "0 auto", padding: "0 20px 60px", display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(270px, 1fr))", gap: 12 }}>
            {Object.entries(TRACKS).map(([id, t]) => (
              <div key={id} onClick={() => goTrack(id)} style={{ background: "#fff", border: "1px solid #e5e5e5", borderTop: "3px solid " + t.color, borderRadius: 10, padding: "20px 18px", cursor: "pointer", position: "relative" }}>
                {t.badge && <span style={{ position: "absolute", top: 10, right: 10, fontSize: 9, fontWeight: 600, padding: "2px 8px", borderRadius: 10, background: t.bg, color: t.color, textTransform: "uppercase" }}>{t.badge}</span>}
                <div style={{ width: 34, height: 34, borderRadius: 8, background: t.bg, color: t.color, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, fontWeight: 700, marginBottom: 10 }}>{t.letter}</div>
                <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 4 }}>{t.label}</div>
                <div style={{ fontSize: 13, color: "#777", lineHeight: 1.5, marginBottom: 10 }}>{t.desc}</div>
                <div style={{ display: "flex", gap: 8, fontSize: 11, color: "#aaa" }}>
                  <span>{t.topics.length} topics</span><span>/</span><span>~{t.topics.length * 15} min</span>
                </div>
                <div style={{ marginTop: 10, fontSize: 13, fontWeight: 500, color: t.color }}>{"Start path \u2192"}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* === TRACK === */}
      {page === "track" && trk && (
        <div style={{ maxWidth: 760, margin: "0 auto", padding: "28px 20px 60px" }}>
          <div onClick={goHome} style={{ fontSize: 13, color: "#888", cursor: "pointer", marginBottom: 16 }}>{"\u2190 All Learning Paths"}</div>
          <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.5, color: trk.color, marginBottom: 6 }}>
            <span style={{ width: 7, height: 7, borderRadius: 4, background: trk.color, display: "inline-block" }} />
            {trk.label}
          </div>
          <h1 style={{ fontSize: 26, fontWeight: 700, marginBottom: 8 }}>{trk.label}</h1>
          <p style={{ fontSize: 14, color: "#777", lineHeight: 1.6, maxWidth: 560, marginBottom: 16 }}>{trk.intro}</p>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 28 }}>
            <div style={{ flex: 1, height: 5, background: "#eee", borderRadius: 3, overflow: "hidden" }}>
              <div style={{ height: "100%", background: trk.color, borderRadius: 3, width: (dc / trk.topics.length * 100) + "%", transition: "width 0.3s" }} />
            </div>
            <span style={{ fontSize: 12, color: "#999" }}>{dc} of {trk.topics.length} done</span>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {trk.topics.map((t, i) => {
              const d = done[tid+"-"+i];
              return (
                <div key={i} onClick={() => goTopic(tid, i)} style={{ background: "#fff", border: "1px solid #e5e5e5", borderRadius: 10, padding: "14px 16px", cursor: "pointer", display: "flex", alignItems: "flex-start", gap: 12 }}>
                  <div style={{ width: 28, height: 28, borderRadius: 14, background: d ? "#ecfdf5" : trk.bg, color: d ? "#059669" : trk.color, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 600, flexShrink: 0 }}>{d ? "\u2713" : i+1}</div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 2 }}>{t.title}</div>
                    <div style={{ fontSize: 12, color: "#888" }}>{t.desc}</div>
                  </div>
                  <div style={{ textAlign: "right", flexShrink: 0 }}>
                    <div style={{ fontSize: 11, color: "#bbb" }}>{t.time}</div>
                    <div style={{ fontSize: 15, color: trk.color, marginTop: 4 }}>{"\u2192"}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* === TOPIC DETAIL === */}
      {page === "topic" && trk && top && (
        <div style={{ maxWidth: 680, margin: "0 auto", padding: "28px 20px 80px" }}>
          <div onClick={() => goTrack(tid)} style={{ fontSize: 13, color: "#888", cursor: "pointer", marginBottom: 20 }}>{"\u2190 Back to " + trk.label}</div>
          <div style={{ marginBottom: 26, paddingBottom: 18, borderBottom: "1px solid #eee" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.4, color: trk.color, marginBottom: 8 }}>
              <span style={{ padding: "2px 8px", borderRadius: 10, background: trk.bg, fontSize: 10 }}>{trk.label}</span>
              <span style={{ fontWeight: 400 }}>Topic {topIdx+1} of {trk.topics.length}</span>
            </div>
            <h1 style={{ fontSize: 22, fontWeight: 700, marginBottom: 6 }}>{top.title}</h1>
            <p style={{ fontSize: 14, color: "#777", lineHeight: 1.6 }}>{top.goal}</p>
            <div style={{ display: "flex", gap: 14, marginTop: 10, fontSize: 12, color: "#999" }}>
              <span>{top.time}</span><span>Step-by-step guide</span>
            </div>
          </div>

          <h2 style={{ fontSize: 16, fontWeight: 600, marginBottom: 10 }}>Step-by-step guide</h2>
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 }}>
            {top.steps.map((st, i) => (
              <div key={i} style={{ background: "#fff", border: "1px solid #e5e5e5", borderRadius: 10, padding: "14px 16px", display: "flex", gap: 12, alignItems: "flex-start" }}>
                <div style={{ width: 22, height: 22, borderRadius: 11, background: trk.color, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 700, flexShrink: 0 }}>{i+1}</div>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 2 }}>{st[0]}</div>
                  <div style={{ fontSize: 13, color: "#777", lineHeight: 1.5 }}>{st[1]}</div>
                </div>
              </div>
            ))}
          </div>

          {topIdx === 0 && tid === "market" && (
            <div style={{ width: "100%", borderRadius: 10, border: "1px solid #e5e5e5", background: "linear-gradient(135deg,#f8f8f6,#eee)", height: 140, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", color: "#bbb", fontSize: 12, margin: "16px 0", gap: 2 }}>
              <span style={{ fontSize: 18, opacity: 0.4 }}>[screenshot]</span>
              <span>Cobalt Market Overview</span>
            </div>
          )}

          <div style={{ borderRadius: 10, padding: "14px 16px", background: trk.bg, borderLeft: "3px solid " + trk.color, fontSize: 13, lineHeight: 1.6, margin: "16px 0" }}>
            <strong>Pro tip: </strong>{top.tip}
          </div>

          {top.resources.length > 0 && (
            <div style={{ marginBottom: 20 }}>
              <h2 style={{ fontSize: 16, fontWeight: 600, marginBottom: 8 }}>Resources</h2>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
                {top.resources.map((r, i) => (
                  <div key={i} onClick={() => r[2] && window.open(r[2], "_blank")} style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 12px", background: "#fff", border: "1px solid #e5e5e5", borderRadius: 8, fontSize: 12, cursor: r[2] ? "pointer" : "default", textDecoration: "none" }}>
                    <div style={{ width: 26, height: 26, borderRadius: 6, background: trk.bg, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 600, color: trk.color, flexShrink: 0 }}>{r[1].charAt(0)}</div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 500 }}>{r[0]}</div>
                      <div style={{ fontSize: 10, color: "#aaa" }}>{r[1]}</div>
                    </div>
                    {r[2] && <div style={{ fontSize: 10, color: trk.color, fontWeight: 600 }}>→</div>}
                  </div>
                ))}
              </div>
            </div>
          )}

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 32, paddingTop: 14, borderTop: "1px solid #eee" }}>
            {topIdx > 0 ? (
              <button onClick={() => goTopic(tid, topIdx-1)} style={{ padding: "7px 14px", borderRadius: 8, fontSize: 13, fontWeight: 500, cursor: "pointer", border: "1px solid #e5e5e5", background: "#fff", color: "#333" }}>{"\u2190 Previous"}</button>
            ) : <div />}
            <button onClick={() => markDone(tid, topIdx)} style={{ background: done[tid+"-"+topIdx] ? "#ecfdf5" : "transparent", border: done[tid+"-"+topIdx] ? "1px solid #059669" : "1px dashed #ccc", color: done[tid+"-"+topIdx] ? "#059669" : "#999", fontSize: 12, padding: "5px 12px", borderRadius: 14, cursor: "pointer" }}>
              {done[tid+"-"+topIdx] ? "\u2713 Completed" : "Mark complete"}
            </button>
            {topIdx < trk.topics.length - 1 ? (
              <button onClick={() => goTopic(tid, topIdx+1)} style={{ padding: "7px 14px", borderRadius: 8, fontSize: 13, fontWeight: 500, cursor: "pointer", border: "none", background: trk.color, color: "#fff" }}>{"Next topic \u2192"}</button>
            ) : (
              <button onClick={goHome} style={{ padding: "7px 14px", borderRadius: 8, fontSize: 13, fontWeight: 500, cursor: "pointer", border: "none", background: trk.color, color: "#fff" }}>{"Finish path \u2713"}</button>
            )}
          </div>
        </div>
      )}

      {/* CHAT BUTTON */}
      <button onClick={() => setChatOpen(o => !o)} style={{ position: "fixed", bottom: 16, right: 16, width: 46, height: 46, borderRadius: 23, background: "linear-gradient(135deg,#2563EB,#7C3AED)", color: "#fff", border: "none", cursor: "pointer", boxShadow: "0 4px 16px rgba(37,99,235,0.3)", fontSize: 18, zIndex: 200 }}>
        {chatOpen ? "\u00D7" : "?"}
      </button>

      {/* CHAT PANEL */}
      {chatOpen && (
        <div style={{ position: "fixed", bottom: 72, right: 16, width: 320, height: 420, background: "#fff", borderRadius: 14, boxShadow: "0 8px 32px rgba(0,0,0,0.12)", border: "1px solid #e5e5e5", zIndex: 200, display: "flex", flexDirection: "column", overflow: "hidden" }}>
          <div style={{ padding: "10px 14px", borderBottom: "1px solid #eee", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <div style={{ width: 26, height: 26, borderRadius: 13, background: "linear-gradient(135deg,#2563EB,#7C3AED)", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 600 }}>AI</div>
              <div>
                <div style={{ fontWeight: 600, fontSize: 12 }}>Cobalt AI Assistant</div>
                <div style={{ fontSize: 10, color: "#059669" }}>Online</div>
              </div>
            </div>
            <button onClick={() => setChatOpen(false)} style={{ background: "none", border: "none", fontSize: 16, cursor: "pointer", color: "#aaa" }}>{"\u00D7"}</button>
          </div>
          <div style={{ flex: 1, padding: "10px 14px", overflowY: "auto", display: "flex", flexDirection: "column", gap: 8 }}>
            {msgs.map((m, i) => (
              <div key={i} style={{ maxWidth: "82%", padding: "7px 11px", borderRadius: m.f === "b" ? "10px 10px 10px 3px" : "10px 10px 3px 10px", fontSize: 12, lineHeight: 1.5, alignSelf: m.f === "b" ? "flex-start" : "flex-end", background: m.f === "b" ? "#f3f4f6" : "#2563EB", color: m.f === "b" ? "#333" : "#fff" }}>{m.t}</div>
            ))}
          </div>
          {sugg && (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 4, padding: "0 14px 8px" }}>
              {SUGGESTIONS.map((q, i) => (
                <button key={i} onClick={() => sendMsg(q)} style={{ fontSize: 10, padding: "3px 9px", borderRadius: 12, border: "1px solid #e5e5e5", background: "#fff", cursor: "pointer", color: "#777" }}>{q}</button>
              ))}
            </div>
          )}
          <div style={{ padding: "8px 10px", borderTop: "1px solid #eee", display: "flex", gap: 6 }}>
            <input value={inp} onChange={e => setInp(e.target.value)} onKeyDown={e => { if (e.key === "Enter") sendMsg(inp); }} placeholder="Ask a question..." style={{ flex: 1, border: "1px solid #e5e5e5", borderRadius: 14, padding: "6px 12px", fontSize: 12, fontFamily: "inherit", outline: "none" }} />
            <button onClick={() => sendMsg(inp)} style={{ width: 28, height: 28, borderRadius: 14, border: "none", background: "#2563EB", color: "#fff", cursor: "pointer", fontSize: 13 }}>{"\u2191"}</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<LearningPaths />);
</script>
</body>
</html>
