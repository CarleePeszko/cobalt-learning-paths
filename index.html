                        sendMsg(inp); }, placeholder: "Ask a question...", style: { flex: 1, border: "1px solid #e5e5e5", borderRadius: 14, padding: "6px 12px", fontSize: 12, fontFamily: "inherit", outline: "none" } }),
                React.createElement("button", { onClick: () => sendMsg(inp), style: { width: 28, height: 28, borderRadius: 14, border: "none", background: "#2563EB", color: "#fff", cursor: "pointer", fontSize: 13 } }, "\u2191"))))));
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(LearningPaths, null));

</script>
